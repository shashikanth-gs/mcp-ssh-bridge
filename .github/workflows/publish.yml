name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  pypi-publish:
    name: Build and upload release to PyPI
    runs-on: ubuntu-latest
    
    # Optional: you can define an environment in GitHub repository settings for PyPI
      
    permissions:
      # IMPORTANT: This permission is required for Trusted Publishing via OIDC
      id-token: write 
      contents: read
      
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install build tools
        run: python -m pip install --upgrade pip build
        
      - name: Build sdist and wheel
        run: python -m build
        
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Note: No username or password/token inputs required for Trusted Publishing
          skip-existing: true
