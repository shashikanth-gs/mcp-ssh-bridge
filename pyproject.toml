[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-mcp-bridge"
version = "2.1.0"
description = "FastMCP-based SSH Bridge for Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "SSH MCP Bridge Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp==4.0.1",
    "mcp==2.1.1",
    "pyyaml>=6.0",
    "paramiko>=3.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.1.0",
    "pyjwt[crypto]>=2.10.1",
    "cryptography>=45.0.1",
    "httpx>=0.25.0",
]

[project.scripts]
ssh-mcp-bridge = "ssh_mcp_bridge.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
